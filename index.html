<!DOCTYPE html>
<html lang="en" data-theme="matrix">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>The Matrix | Essential Developer Toolkit - Encode, Convert, Format, System Utilities</title>
    
    <meta name="description" content="The Matrix: Clean, high-performance online toolkit designed for developers. Features professional utilities like JSON formatting, Base64 encoding/decoding, timestamp conversion, color tools, and system security aids.">
    
    <meta name="keywords" content="Developer tools, online toolbox, JSON formatter, Base64 converter, Timestamp converter, HEX to RGB, Web development utilities, Encoding and Decoding">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>

<header class="site-header">
    <div class="brand">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
            <h1>The Matrix</h1>
            <div class="subtitle">A focused toolkit for everyday development</div>
        </div>
    </div>
    <div class="header-status" aria-label="Application status">
        <span class="status-dot"></span><span>LOCAL · READY</span>
    </div>
</header>

<nav aria-label="Tool categories">
    <div class="nav-menu">
        <div class="nav-category-dropdown">
            <button class="nav-category active" data-category="text" aria-expanded="false">Text Tools</button>
            <div class="dropdown-content" id="dropdown-text"></div>
        </div>
        <div class="nav-category-dropdown">
            <button class="nav-category" data-category="time" aria-expanded="false">Time & Date</button>
            <div class="dropdown-content" id="dropdown-time"></div>
        </div>
        <div class="nav-category-dropdown">
            <button class="nav-category" data-category="security" aria-expanded="false">Security</button>
            <div class="dropdown-content" id="dropdown-security"></div>
        </div>
        <div class="nav-category-dropdown">
            <button class="nav-category" data-category="encoding" aria-expanded="false">Encoding</button>
            <div class="dropdown-content" id="dropdown-encoding"></div>
        </div>
        <div class="nav-category-dropdown">
            <button class="nav-category" data-category="unit" aria-expanded="false">Unit</button>
            <div class="dropdown-content" id="dropdown-unit"></div>
        </div>
        <div class="nav-category-dropdown">
            <button class="nav-category" data-category="network" aria-expanded="false">Network</button>
            <div class="dropdown-content" id="dropdown-network"></div>
        </div>
        <div class="nav-category-dropdown">
            <button class="nav-category" data-category="dev" aria-expanded="false">Dev</button>
            <div class="dropdown-content" id="dropdown-dev"></div>
        </div>
    </div>
</nav>

<div class="main">
    <div class="workspace" id="workspace">
        <div class="panel input-panel">
            <div class="panel-header">
                <div><div class="panel-kicker" id="input-kicker">SOURCE</div><div class="panel-title" id="input-title">Input</div></div>
                <div class="panel-subtitle" id="input-subtitle">Enter your data here</div>
            </div>
            
            <div id="dynamic-input-container" class="dynamic-container" style="display:none;"></div>

            <div class="stopwatch" id="stopwatch" role="timer" aria-live="off" style="display:none;">
                <svg class="clock-dial" viewBox="0 0 100 100" aria-hidden="true">
                    <circle class="clock-face" cx="50" cy="50" r="45" />
                    <line class="clock-tick" x1="50" y1="9"  x2="50" y2="15" />
                    <line class="clock-tick" x1="50" y1="85" x2="50" y2="91" />
                    <line class="clock-tick" x1="9"  y1="50" x2="15" y2="50" />
                    <line class="clock-tick" x1="85" y1="50" x2="91" y2="50" />
                    <line id="clock-hour"   class="clock-hand clock-hand-hour"     x1="50" y1="50" x2="50" y2="28" />
                    <line id="clock-minute" class="clock-hand clock-hand-minute" x1="50" y1="50" x2="50" y2="16" />
                    <line id="clock-second" class="clock-hand clock-hand-second" x1="50" y1="50" x2="50" y2="14" />
                    <circle class="clock-cap" cx="50" cy="50" r="2.6" />
                </svg>
                <div class="stopwatch-time"><span id="clock-digital">--:--:--</span><span class="stopwatch-ms" id="clock-ms">.000</span></div>
                <div class="clock-date" id="clock-date">—</div>
            </div>

            <textarea id="input" placeholder="Paste your data..."></textarea>
            
            <div class="action-buttons" id="input-actions">
                <button class="action-btn secondary" onclick="clearInput()">Clear</button>
                <button class="action-btn secondary" onclick="selectInput()">Select all</button>
            </div>
        </div>

        <div class="mid">
            <button class="run" id="run" title="Run tool (Ctrl/⌘ + Enter)" aria-label="Run selected tool"><span>Run</span><b>→</b></button>
            <div class="run-label" id="run-label">CTRL / ⌘ + ENTER</div>

            <div id="bidirectional-controls" style="display:none;">
                <button class="run primary" id="encode-btn" title="Encode Input to Output">Encode ➡</button>
                <div class="run-label">Input to Output</div>
                
                <button class="run secondary" id="decode-btn" title="Decode Output to Input">⬅ Decode</button>
                <div class="run-label">Output to Input</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div><div class="panel-kicker">RESULT</div><div class="panel-title">Output</div></div>
                <div class="panel-subtitle" id="output-subtitle">Results will appear here</div>
            </div>

            <div class="tool-info" id="tool-info">
                <h3>Welcome</h3>
                <p>Select a tool from the menu above</p>
            </div>

            <textarea id="output"  placeholder="Output will appear here" style="display:none;"></textarea>
            
            <div id="rich-output" class="rich-output" style="display:none;"></div>
            
            <canvas id="qr-canvas" style="display:none; margin-top:1rem; background:white;"></canvas>

            <div class="action-buttons">
                <button class="action-btn secondary" id="copy-output" onclick="copyOutput()">Copy</button>
                <button class="action-btn secondary" id="select-output" onclick="selectOutput()">Select all</button>
                <button class="action-btn secondary danger" onclick="clearAll()">Reset</button>
            </div>
        </div>
    </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
